name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build plugin
        run: dotnet build src/LevelUpChoicesFixes.csproj --configuration Release

      - name: Generate package artwork
        run: python3 quality_chance_chart.py

      - name: Build Thunderstore package
        run: python3 scripts/package.py

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/TeamTayne-LevelUpChoicesFixes-*.zip
